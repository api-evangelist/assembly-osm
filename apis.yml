description: >-
  Assembly OSM is a New York City off-site manufacturing company founded in 2019 by SHoP
  Architects co-founders Bill and Chris Sharples to industrialise the construction of
  high-rise urban housing. The company calls its method "post-modular": rather than
  trucking finished volumetric boxes from a single factory, Assembly designs a
  kit-of-parts chassis and distributes fabrication across a network of specialist
  suppliers — an aerospace and automotive supply-chain model applied to buildings — then
  stacks the resulting units on site, claiming delivery of market-competitive high-rise
  residential architecture in roughly 60% of conventional schedule. Its buildings are
  all-electric and passive-design led, targeting 55-70% energy-efficiency improvement and
  35% less embodied carbon today, net-zero operational carbon by 2027 and climate-positive
  buildings by 2040. Completed and in-progress work includes Prototype Alpha, 147 St.
  Felix Street and 247 East 117th Street in New York, plus an AOSM Canada operation. The
  company has raised more than $60 million, including a $38 million Series A in 2022, and
  draws engineering staff from SpaceX, Tesla and Boeing. Assembly runs a digital-twin
  engineering platform — a heavily scripted CATIA environment carrying each module from
  design through fabrication to installation — but that platform is an internal
  manufacturing tool, not a product: Assembly OSM sells buildings, and publishes no
  developer program, no public API, no SDK and no machine-readable API contract of any
  kind.
